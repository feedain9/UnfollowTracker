<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
</head>
<body>
  <h1>Download these icons for the extension:</h1>
  <p>Right-click each icon and save as the corresponding filename.</p>
  
  <h3>icon16.png</h3>
  <canvas id="icon16" width="16" height="16"></canvas>
  
  <h3>icon32.png</h3>
  <canvas id="icon32" width="32" height="32"></canvas>
  
  <h3>icon48.png</h3>
  <canvas id="icon48" width="48" height="48"></canvas>
  
  <h3>icon128.png</h3>
  <canvas id="icon128" width="128" height="128"></canvas>
  
  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const center = size / 2;
      
      // Gradient background
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#667eea');
      grad.addColorStop(1, '#764ba2');
      
      // Background circle
      ctx.beginPath();
      ctx.arc(center, center, size * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      
      // Eye ellipse
      ctx.beginPath();
      ctx.ellipse(center, center, size * 0.25, size * 0.18, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'white';
      ctx.lineWidth = size * 0.03;
      ctx.stroke();
      
      // Pupil
      ctx.beginPath();
      ctx.arc(center, center, size * 0.09, 0, Math.PI * 2);
      ctx.fillStyle = 'white';
      ctx.fill();
      
      // Inner pupil
      ctx.beginPath();
      ctx.arc(center, center, size * 0.045, 0, Math.PI * 2);
      ctx.fillStyle = '#667eea';
      ctx.fill();
    }
    
    ['icon16', 'icon32', 'icon48', 'icon128'].forEach(id => {
      drawIcon(document.getElementById(id));
    });
  </script>
</body>
</html>
